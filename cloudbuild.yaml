steps:
  - name: 'node:22'
    entrypoint: bash
    args: ['-c', 'npm install']
    dir: 'client'
 
  - name: 'node:20'
    entrypoint: bash
    args: ['-c', 'npm run build']
    dir: 'client'
 
 
  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['app', 'deploy','clientAppEngine.yaml']
 
options:
  logging: CLOUD_LOGGING_ONLY